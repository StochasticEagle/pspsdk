name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential cmake fakeroot flex gawk gettext \
            git libarchive-dev libarchive-tools libcurl4-openssl-dev libgmp-dev \
            libgpgme-dev libgsl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libssl-dev libtool libusb-dev meson ninja-build patch pkg-config \
            texinfo wget xz-utils zlib1g-dev

      - name: Build forked PSP toolchain
        run: |
          export PSPDEV="$RUNNER_TEMP/pspdev"
          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"

          git clone --depth 1 --branch dev/fork \
            --recurse-submodules --shallow-submodules \
            https://github.com/StochasticEagle/psp-toolchain.git \
            "$RUNNER_TEMP/psp-toolchain"

          "$RUNNER_TEMP/psp-toolchain/toolchain.sh"

      - name: Build PSPSDK
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          ./build-and-install.sh
          ./build-cfw-and-install.sh

      - name: Compile examples
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          make -C src/samples -f Makefile.samples -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Archive examples
        run: tar -zcvf samples.tar.gz src/samples

      - uses: actions/upload-artifact@v7
        with:
          name: samples-${{ github.sha }}
          path: samples.tar.gz
