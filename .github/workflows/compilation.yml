name: GCC 16.2 SDK compilation

on:
  push:
    branches: [gcc-16.2]
  pull_request:
    branches: [gcc-16.2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  checks: write

concurrency:
  group: pspsdk-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential cmake fakeroot flex gawk gettext \
            git libarchive-dev libarchive-tools libcurl4-openssl-dev libgmp-dev \
            libgpgme-dev libgsl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libssl-dev libtool libusb-dev meson ninja-build patch pkg-config \
            python3 python3-venv texinfo wget xz-utils zlib1g-dev

      - name: Resolve pinned GCC 16.2 toolchain artifact
        id: toolchain
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
        run: |
          set -euo pipefail
          bash ci/resolve-gcc16-artifact.sh

      - name: Download pinned GCC 16.2 compiler
        uses: actions/download-artifact@v4
        with:
          repository: StochasticEagle/psp-toolchain
          run-id: ${{ steps.toolchain.outputs.run_id }}
          name: gcc16-toolchain-ubuntu-x86_64
          github-token: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
          path: upstream

      - name: Install GCC 16.2 toolchain
        run: |
          export PSPDEV=/opt/pspdev
          sudo tar -xzf upstream/gcc16-toolchain.tar.gz -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"
          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          export PATH="$PSPDEV/bin:$PATH"
          test "$(psp-gcc -dumpmachine)" = psp
          test "$(psp-gcc -dumpfullversion)" = 16.2.0
          grep -Fxq "toolchain_commit=$(cat ci/gcc16-toolchain-sha.txt)" "$PSPDEV/share/psp-ci/toolchain-source.txt"

      - name: Build PSPSDK
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          ./build-and-install.sh

      - name: Test CMake package discovery
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          tests/toolchain-smoke/run-find-prefix-probe.sh cmake

          python3 -m venv "$RUNNER_TEMP/cmake4"
          "$RUNNER_TEMP/cmake4/bin/pip" install --disable-pip-version-check cmake==4.4.3
          tests/toolchain-smoke/run-find-prefix-probe.sh "$RUNNER_TEMP/cmake4/bin/cmake"

      - name: Compile PSPTEST framework module
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          source_dir="$GITHUB_WORKSPACE/psptest/framework"
          build_dir="$GITHUB_WORKSPACE/build/ci-psptest/framework"

          rm -rf "$build_dir"
          mkdir -p "$build_dir"
          cp psptest/psptest.exp "$build_dir/psptest.exp"
          # Do not pass LDFLAGS= on the make command line. That would
          # suppress build.mak's -L paths, unlike production PSPTEST.
          printf 'override LDFLAGS += -nostartfiles\n' > "$build_dir/psptest-overrides.mk"

          make -C "$build_dir" \
            -f "$source_dir/Makefile.test" \
            -f "$build_dir/psptest-overrides.mk" \
            VPATH="$source_dir" \
            PRX_EXPORTS="$build_dir/psptest.exp" \
            all

          test -f "$build_dir/psptest-framework.prx"
          # Check symbols actually exported by libpsptest (the runner
          # API is psptest_run_suite, not a nonexistent psptest_run_module).
          psp-nm -g --defined-only "$PSPDEV/psp/sdk/lib/libpsptest.a" > "$build_dir/psptest-symbols.txt"
          grep -Eq '[[:space:]][Tt][[:space:]]+psptest_run_suite

      - name: Compile examples
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          make -C src/samples -f Makefile.samples -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Archive examples
        run: tar -zcvf samples.tar.gz src/samples

      - uses: actions/upload-artifact@v7
        with:
          name: samples-${{ github.sha }}
          path: samples.tar.gz

      - name: Report legacy PRX status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const legacy = [
              'intraFont-vlf.prx',
              'lflash_fdisk.prx',
              'libpsardumper.prx',
              'pspdecrypt.prx',
              'vlf.prx'
            ];
            const missing = legacy.filter(name => !fs.existsSync(`src/pre-built/${name}`));
            if (missing.length === 0) {
              return;
            }

            core.warning(`Legacy pre-built PRXs unavailable: ${missing.join(', ')}`);
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Legacy PRX status',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Legacy PRX set is incomplete',
                  summary: `Temporary soft-fail: missing ${missing.join(', ')}. Source-built modules remain strict.`
                }
              });
            } catch (error) {
              core.warning(`Unable to publish neutral Legacy PRX check: ${error.message}`);
            }
 "$build_dir/psptest-symbols.txt"
          grep -Eq '[[:space:]][Tt][[:space:]]+psptest_call_test_with_gp

      - name: Compile examples
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          make -C src/samples -f Makefile.samples -j "$(getconf _NPROCESSORS_ONLN)"

      - name: Archive examples
        run: tar -zcvf samples.tar.gz src/samples

      - uses: actions/upload-artifact@v7
        with:
          name: samples-${{ github.sha }}
          path: samples.tar.gz

      - name: Report legacy PRX status
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const legacy = [
              'intraFont-vlf.prx',
              'lflash_fdisk.prx',
              'libpsardumper.prx',
              'pspdecrypt.prx',
              'vlf.prx'
            ];
            const missing = legacy.filter(name => !fs.existsSync(`src/pre-built/${name}`));
            if (missing.length === 0) {
              return;
            }

            core.warning(`Legacy pre-built PRXs unavailable: ${missing.join(', ')}`);
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Legacy PRX status',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'neutral',
                output: {
                  title: 'Legacy PRX set is incomplete',
                  summary: `Temporary soft-fail: missing ${missing.join(', ')}. Source-built modules remain strict.`
                }
              });
            } catch (error) {
              core.warning(`Unable to publish neutral Legacy PRX check: ${error.message}`);
            }
 "$build_dir/psptest-symbols.txt"

      - name: Compile examples
        run: |
