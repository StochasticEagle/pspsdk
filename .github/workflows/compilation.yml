name: GCC 16.2 SDK artifact

on:
  push:
    branches: [gcc-16.2]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gcc16-sdk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sdk:
    if: github.ref == 'refs/heads/gcc-16.2'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PSPDEV: /opt/pspdev
      GH_TOKEN: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: false

      - name: Find validated toolchain artifact for pinned upstream commit
        id: upstream
        shell: bash
        run: |
          set -euo pipefail
          sha="$(cat ci/gcc16-toolchain-sha.txt)"
          [[ "$sha" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Invalid toolchain pin"; exit 1; }
          runs="$(gh api 'repos/StochasticEagle/psp-toolchain/actions/workflows/gcc16-artifact.yml/runs?branch=gcc-16.2&status=success&per_page=100')"
          run_id="$(jq -r --arg sha "$sha" '
            [.workflow_runs[] | select(.head_sha == $sha and .conclusion == "success")][0].id // empty' <<< "$runs")"
          if [[ -z "$run_id" ]]; then
            echo "::error::No successful GCC 16.2 toolchain artifact for pinned commit $sha. Build upstream first."
            exit 1
          fi
          artifacts="$(gh api "repos/StochasticEagle/psp-toolchain/actions/runs/$run_id/artifacts?per_page=100")"
          jq -e '.artifacts[] | select(.name == "gcc16-toolchain-ubuntu-x86_64" and .expired == false)' \
            <<< "$artifacts" >/dev/null || {
            echo "::error::The pinned toolchain run $run_id has no usable artifact."
            exit 1
          }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@v4
        with:
          name: gcc16-toolchain-ubuntu-x86_64
          repository: StochasticEagle/psp-toolchain
          run-id: ${{ steps.upstream.outputs.run_id }}
          github-token: ${{ secrets.PSP_CI_ARTIFACT_TOKEN || github.token }}
          path: upstream

      - name: Install validated toolchain without rebuilding it
        shell: bash
        run: |
          set -euo pipefail
          sudo tar -xzf upstream/gcc16-toolchain.tar.gz -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          export PATH="$PSPDEV/bin:$PATH"
          grep -Fxq "toolchain_commit=${{ steps.upstream.outputs.sha }}" "$PSPDEV/share/psp-ci/toolchain-source.txt"
          test "$(psp-gcc -dumpfullversion)" = 16.2.0
          test "$(psp-gcc -dumpmachine)" = psp

      - name: Install SDK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake bison build-essential cmake flex gawk gettext git \
            libtool libusb-1.0-0-dev pkg-config python3 python3-venv \
            meson ninja-build texinfo

      - name: Build PSPSDK using pinned GCC 16.2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$PSPDEV/bin:$PATH"
          ./build-and-install.sh
          test -f "$PSPDEV/psp/sdk/lib/libpspsdk.a"
          test -f "$PSPDEV/psp/sdk/lib/build.mak"
          test -x "$PSPDEV/bin/psp-config"
          printf 'format=1\nsdk_commit=%s\ntoolchain_commit=%s\ncompiler=%s\n' \
            "$GITHUB_SHA" "$(cat ci/gcc16-toolchain-sha.txt)" "$(psp-gcc -dumpfullversion)" \
            > "$PSPDEV/share/psp-ci/sdk-source.txt"

      - name: Archive complete toolchain and SDK installation once
        shell: bash
        run: |
          set -euo pipefail
          tar -czf "$RUNNER_TEMP/gcc16-sdk.tar.gz" -C /opt pspdev
          tar -tzf "$RUNNER_TEMP/gcc16-sdk.tar.gz" | grep -Fxq 'pspdev/share/psp-ci/sdk-source.txt'

      - uses: actions/upload-artifact@v7
        with:
          name: gcc16-sdk-ubuntu-x86_64
          path: ${{ runner.temp }}/gcc16-sdk.tar.gz
          if-no-files-found: error
          retention-days: 30
