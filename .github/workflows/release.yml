name: Release prebuilt PSPSDK

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: pspsdk-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake bison build-essential cmake fakeroot flex gawk gettext \
            git libarchive-dev libarchive-tools libcurl4-openssl-dev libgmp-dev \
            libgpgme-dev libgsl-dev libmpc-dev libmpfr-dev libreadline-dev \
            libssl-dev libtool libusb-dev meson ninja-build patch pkg-config \
            texinfo wget xz-utils zlib1g-dev

      - name: Install prebuilt PSP toolchain
        run: |
          export PSPDEV=/opt/pspdev
          archive="$RUNNER_TEMP/psp-toolchain-ubuntu-x86_64.tar.gz"

          sudo rm -rf "$PSPDEV"
          wget -q \
            https://github.com/StochasticEagle/psp-toolchain/releases/latest/download/psp-toolchain-ubuntu-x86_64.tar.gz \
            -O "$archive"
          sudo tar -xzf "$archive" -C /opt
          sudo chown -R "$(id -u):$(id -g)" "$PSPDEV"

          export PATH="$PSPDEV/bin:$PATH"
          echo "PSPDEV=$PSPDEV" >> "$GITHUB_ENV"
          echo "$PSPDEV/bin" >> "$GITHUB_PATH"
          test "$(psp-gcc -dumpmachine)" = "psp"

      - name: Build and verify PSPSDK
        run: |
          export PATH="$PSPDEV/bin:$PATH"
          ./build-and-install.sh
          test "$(psp-config --pspsdk-path)" = "$PSPDEV/psp/sdk"
          test -f "$PSPDEV/psp/sdk/lib/libpspsdk.a"
          test -f "$PSPDEV/psp/sdk/lib/build.mak"

      - name: Stage PSPSDK overlay
        run: |
          stage="$RUNNER_TEMP/pspsdk-stage"
          rm -rf "$stage"
          mkdir -p "$stage"

          make -j "$(getconf _NPROCESSORS_ONLN)" DESTDIR="$stage" install

          mkdir -p "$stage/opt/pspdev/psp/lib"
          for lib in \
            libcglue libpthreadglue libpspprof libpsputility libpsprtc \
            libpspnet_inet libpspnet_resolver libpspsdk libpspmodinfo \
            libpspuser libpspkernel; do
            ln -sfn "../sdk/lib/$lib.a" "$stage/opt/pspdev/psp/lib/$lib.a"
          done

          mkdir -p "$stage/opt/pspdev/psp/share/licenses/pspsdk"
          cp LICENSE "$stage/opt/pspdev/psp/share/licenses/pspsdk/"

          mkdir -p "$stage/opt/pspdev/share/licenses/PrxEncrypter"
          cp tools/PrxEncrypter/LICENSE "$stage/opt/pspdev/share/licenses/PrxEncrypter/"

      - name: Archive PSPSDK
        run: |
          stage="$RUNNER_TEMP/pspsdk-stage"
          archive="$RUNNER_TEMP/pspsdk-ubuntu-x86_64.tar.gz"
          tar -czf "$archive" -C "$stage/opt" pspdev

          tar -tzf "$archive" | grep -qx 'pspdev/bin/psp-config'
          tar -tzf "$archive" | grep -qx 'pspdev/psp/sdk/lib/libpspsdk.a'
          if tar -tzf "$archive" | grep -qx 'pspdev/bin/psp-gcc'; then
            echo "ERROR: PSPSDK archive unexpectedly contains the compiler toolchain."
            exit 1
          fi

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.tag }}
          target_commitish: ${{ github.sha }}
          name: PSPSDK ${{ inputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: ${{ runner.temp }}/pspsdk-ubuntu-x86_64.tar.gz
